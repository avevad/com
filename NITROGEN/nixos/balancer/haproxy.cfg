global
    log /dev/log    local0
    log /dev/log    local1 notice
    daemon

    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets



defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  log-health-checks
    timeout connect 5000
    timeout client  50000
    timeout server  500000



frontend main
    bind 77.233.223.179:80
    bind 77.233.223.179:443 ssl crt /var/certs/live/avevad.com/haproxy.pem
    bind 10.100.0.1:80
    bind 10.100.0.1:443 ssl crt /var/lib/acme/avedus.pro/full.pem


    http-request redirect scheme https unless { ssl_fc }
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-header X-Forwarded-For %[src]
    http-after-response set-header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload" if { ssl_fc }


    acl local_network src 192.168.0.0/16
    acl local_network src 172.17.0.0/16
    acl local_network src 10.0.0.0/8

    use_backend passwords if { hdr(host) -i passwords.at.avedus.pro } local_network

    use_backend prom if { hdr(host) -i prom.nitrogen.avedus.pro } local_network
    use_backend alerts if { hdr(host) -i alerts.nitrogen.avedus.pro } local_network
    use_backend metrics if { hdr(host) -i metrics.at.avedus.pro } local_network

    use_backend proxmox_ac if { hdr(host) -i proxmox-ac.at.avedus.pro } local_network

    use_backend copyfail if { hdr(host) -i copyfail.avevad.com }

    default_backend stub



backend passwords
    server vaultwarden 127.0.0.1:8808 check

backend prom
    server prometheus 127.0.0.1:9090 check

backend alerts
    server alertmanager 127.0.0.1:9093 check

backend metrics
    server grafana 127.0.0.1:3000 check

backend proxmox_ac
    server proxmox 10.10.10.100:8006 ssl verify none check

backend copyfail
    server nginx 127.0.0.1:8080 check

backend stub
    mode http
    http-request deny deny_status 404
