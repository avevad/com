global:
  scrape_interval:     15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
  - scheme: https
    static_configs:
      - targets: ['alerts.nitrogen.avedus.pro:443']

scrape_configs:
  - job_name: prometheus
    scheme: https
    static_configs:
      - targets: ['prom.nitrogen.avedus.pro:443']
  - job_name: alertmanager
    scheme: https
    static_configs:
      - targets: ['alerts.nitrogen.avedus.pro:443']
  - job_name: kkksave
    metrics_path: '/GezLGsNLO73dwn4E2-59TNyABlypkz33o9uIsRZS2vI/metrics'
    scheme: https
    static_configs:
      - targets: [ 'kksav.com' ]
